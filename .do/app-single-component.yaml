# Single-component deploy: API + frontend from one service. No /api routing rules needed.
# Use this if path-based routing (/api → api) keeps giving 404 on DigitalOcean.
#
# To use: In DO dashboard, create a new app from this spec, or edit your app and
# replace the spec with this file (then delete the "web" static site component
# and use this single "api" service with the build/run below).
#
# Build: builds Helm (frontend), copies to backend/public. Run: node server.js from backend.
# Server serves /api/* as API and everything else as the SPA.

name: meridian
region: nyc

databases:
  - engine: PG
    name: db
    version: "17"

features:
  - buildpack-stack=ubuntu-22

# No ingress rules needed — one component gets all traffic
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: api
    environment_slug: node-js
    # Repo root so we can build both Helm and backend
    source_dir: /
    build_command: |
      cd Helm && npm ci && VITE_API_URL=https://revops-ntkll.ondigitalocean.app npm run build &&
      cd ../backend && npm ci && mkdir -p public && cp -r ../Helm/dist/* public/
    run_command: cd backend && node server.js
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
        scope: RUN_TIME
      - key: SESSION_SECRET
        value: "PASTE_LONG_RANDOM_STRING"
        scope: RUN_TIME
      - key: FRONTEND_URL
        value: "https://revops-ntkll.ondigitalocean.app"
        scope: RUN_TIME
      - key: APP_URL
        value: "https://revops-ntkll.ondigitalocean.app"
        scope: RUN_TIME
      - key: OKTA_ISSUER
        value: "PASTE_OKTA_ISSUER"
        scope: RUN_TIME
      - key: OKTA_CLIENT_ID
        value: "PASTE_OKTA_CLIENT_ID"
        scope: RUN_TIME
      - key: OKTA_CLIENT_SECRET
        value: "PASTE_OKTA_CLIENT_SECRET"
        scope: RUN_TIME
      - key: SERVE_STATIC
        value: "true"
        scope: RUN_TIME
    github:
      deploy_on_push: true
      repo: digitalocean/RevOps
      branch: helm-deploy
