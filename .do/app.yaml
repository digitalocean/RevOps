# Meridian — DigitalOcean App Platform
# API = Meridian backend (/backend). Web = Meridian UI built from /Helm (full Helm app, branded Meridian).
# /api → API service; / → static site (Meridian).

name: meridian
region: nyc

databases:
  - engine: PG
    name: db
    version: "17"

features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /api
    - component:
        name: web
      match:
        path:
          prefix: /

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: api
    environment_slug: node-js
    build_command: npm ci && npm run build
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      # Allow DB SSL with self-signed cert (e.g. DO Managed Database)
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
        scope: RUN_TIME
    github:
      deploy_on_push: true
      repo: digitalocean/RevOps
      branch: main
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: node server.js
    source_dir: /backend

static_sites:
  - name: web
    build_command: npm install && npm run build
    environment_slug: node-js
    envs:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
        scope: BUILD_TIME
      - key: VITE_API_URL
        value: "https://revops-ntkll.ondigitalocean.app"
        scope: BUILD_TIME
    github:
      deploy_on_push: true
      repo: digitalocean/RevOps
      branch: main
    output_dir: dist
    source_dir: /Helm
    index_document: index.html
    catchall_document: index.html
