# DigitalOcean App Platform — PRODUCTION (todoapp-jzfe4)
#
# Branch: production — deploy from this branch only for production.
# Repo is set to digitalocean/RevOps — change if you fork.
# Secrets: set SESSION_SECRET, OKTA_*, SAML_IDP_METADATA_URL, DATABASE_URL in DO dashboard if not using ${db.DATABASE_URL}.
#
# Production URL: https://todoapp-jzfe4.ondigitalocean.app

name: meridian
region: nyc

features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /api
    - component:
        name: web
      match:
        path:
          prefix: /

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: api
    environment_slug: node-js
    build_command: npm install && npm run build
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: "SET_IN_DASHBOARD_OR_LINK_DATABASE"
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
        scope: RUN_TIME
      - key: SESSION_SECRET
        value: "PASTE_LONG_RANDOM_STRING"
        scope: RUN_TIME
      - key: FRONTEND_URL
        value: "https://todoapp-jzfe4.ondigitalocean.app"
        scope: RUN_TIME
      - key: APP_URL
        value: "https://todoapp-jzfe4.ondigitalocean.app"
        scope: RUN_TIME
      - key: OKTA_ISSUER
        value: "PASTE_OKTA_ISSUER"
        scope: RUN_TIME
      - key: OKTA_CLIENT_ID
        value: "PASTE_OKTA_CLIENT_ID"
        scope: RUN_TIME
      - key: OKTA_CLIENT_SECRET
        value: "PASTE_OKTA_CLIENT_SECRET"
        scope: RUN_TIME
      - key: SAML_IDP_METADATA_URL
        value: "PASTE_OKTA_SAML_METADATA_URL"
        scope: RUN_TIME
      - key: SAML_SP_ENTITY_ID
        value: "https://todoapp-jzfe4.ondigitalocean.app"
        scope: RUN_TIME
      - key: SAML_APP_BASE_URL
        value: "https://todoapp-jzfe4.ondigitalocean.app"
        scope: RUN_TIME
    github:
      deploy_on_push: true
      repo: digitalocean/RevOps
      branch: production
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: npm start
    source_dir: /backend

static_sites:
  - name: web
    build_command: npm install && npm run build
    environment_slug: node-js
    envs:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
        scope: BUILD_TIME
      - key: VITE_API_URL
        value: "https://todoapp-jzfe4.ondigitalocean.app"
        scope: BUILD_TIME
    github:
      deploy_on_push: true
      repo: digitalocean/RevOps
      branch: production
    output_dir: dist
    source_dir: /frontend
    index_document: index.html
    catchall_document: index.html
