# =============================================================================
# DigitalOcean App Platform — stingray-app (live Meridian / RevOps)
# =============================================================================
#
# External Managed Postgres only — no `databases:` block (avoids create/delete
# spec errors when the app has no App Platform–managed database).
#
# Component names match a typical live app: revops (API), revops-helm (static UI).
# Ingress: /api → API, / → Vite static site (same hostname).
#
# Update (replace APP_ID with your app UUID from `doctl apps list`):
#   doctl apps update APP_ID --spec app-stingray.yaml
#
# Before first use:
#   1. Replace DATABASE_URL (or delete from spec and set Encrypted in DO dashboard).
#   2. SESSION_SECRET: openssl rand -hex 32
# Sample mode (current): AUTH_SAMPLE_MODE=true — email/password only; no Okta/SAML in spec.
#   For SSO later: set AUTH_SAMPLE_MODE=false (or remove), add SAML_* / OKTA_* envs on revops.
#
# =============================================================================

name: stingray-app
region: nyc

features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - component:
        name: revops
      match:
        path:
          prefix: /api
    - component:
        name: revops-helm
      match:
        path:
          prefix: /

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: revops
    environment_slug: node-js
    build_command: npm install && npm run build
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: "postgresql://REPLACE_USER:REPLACE_PASSWORD@REPLACE_HOST:25060/db?sslmode=require"
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
        scope: RUN_TIME
      - key: SESSION_SECRET
        value: "PASTE_OPENSSL_RAND_HEX_32"
        scope: RUN_TIME
      - key: FRONTEND_URL
        value: "https://stingray-app-mc7ii.ondigitalocean.app"
        scope: RUN_TIME
      - key: APP_URL
        value: "https://stingray-app-mc7ii.ondigitalocean.app"
        scope: RUN_TIME
      - key: AUTH_SAMPLE_MODE
        value: "true"
        scope: RUN_TIME
    github:
      deploy_on_push: true
      repo: digitalocean/RevOps
      branch: helm-deploy
    http_port: 8080
    instance_count: 2
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: npm start
    source_dir: /backend

static_sites:
  - name: revops-helm
    build_command: npm install && npm run build
    environment_slug: node-js
    envs:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
        scope: BUILD_TIME
      - key: VITE_API_URL
        value: "https://stingray-app-mc7ii.ondigitalocean.app"
        scope: BUILD_TIME
    github:
      deploy_on_push: true
      repo: digitalocean/RevOps
      branch: helm-deploy
    output_dir: dist
    source_dir: /Helm
    index_document: index.html
    catchall_document: index.html
