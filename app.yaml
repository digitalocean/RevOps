# DigitalOcean App Platform spec (also in .do/app.yaml).
# Env vars are listed below; in DO dashboard edit values or add these keys if missing.
#
# IMPORTANT: This app has TWO components:
#   - api (Service) = backend
#   - revops (Static Site) = frontend (Helm/Vite). Name must match the component DO created (e.g. "revops") to avoid duplicate "/" ingress rule.

name: meridian
region: nyc

databases:
  - engine: PG
    name: db
    version: "17"

features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /api
    - component:
        name: revops
      match:
        path:
          prefix: /

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

services:
  - name: api
    environment_slug: node-js
    build_command: npm install && npm run build
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
        scope: RUN_TIME
      - key: SESSION_SECRET
        value: "PASTE_LONG_RANDOM_STRING"
        scope: RUN_TIME
      - key: FRONTEND_URL
        value: "https://revops-ntkll.ondigitalocean.app"
        scope: RUN_TIME
      - key: APP_URL
        value: "https://revops-ntkll.ondigitalocean.app"
        scope: RUN_TIME
      - key: OKTA_ISSUER
        value: "PASTE_OKTA_ISSUER"
        scope: RUN_TIME
      - key: OKTA_CLIENT_ID
        value: "PASTE_OKTA_CLIENT_ID"
        scope: RUN_TIME
      - key: OKTA_CLIENT_SECRET
        value: "PASTE_OKTA_CLIENT_SECRET"
        scope: RUN_TIME
      - key: SAML_IDP_METADATA_URL
        value: "https://digitalocean.okta.com/app/exk1a2t62juiN4Nmk2p8/sso/saml/metadata"
        scope: RUN_TIME
      - key: SAML_SP_ENTITY_ID
        value: "https://revops-ntkll.ondigitalocean.app"
        scope: RUN_TIME
      - key: SAML_APP_BASE_URL
        value: "https://revops-ntkll.ondigitalocean.app"
        scope: RUN_TIME
    github:
      deploy_on_push: true
      repo: digitalocean/RevOps
      branch: helm-deploy
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: node server.js
    source_dir: /backend

# Frontend (Static Site) — name must match existing DO component (e.g. "revops") so "/" route is not duplicated
static_sites:
  - name: revops
    build_command: npm install && npm run build
    environment_slug: node-js
    envs:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
        scope: BUILD_TIME
      - key: VITE_API_URL
        value: "https://revops-ntkll.ondigitalocean.app"
        scope: BUILD_TIME
    github:
      deploy_on_push: true
      repo: digitalocean/RevOps
      branch: helm-deploy
    output_dir: dist
    source_dir: /Helm
    index_document: index.html
    catchall_document: index.html
