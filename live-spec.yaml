alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: revops
    match:
      authority: {}
      path:
        prefix: /revops
  - component:
      name: revops-helm
    match:
      authority: {}
      path:
        prefix: /
name: stingray-app
region: nyc
services:
- environment_slug: node-js
  github:
    branch: helm-deploy
    deploy_on_push: true
    repo: digitalocean/RevOps
  http_port: 8080
  instance_count: 2
  instance_size_slug: apps-s-1vcpu-1gb
  name: revops
  run_command: npm start
  source_dir: /backend
- environment_slug: node-js
  github:
    branch: helm-deploy
    deploy_on_push: true
    repo: digitalocean/RevOps
  http_port: 8080
  instance_count: 2
  instance_size_slug: apps-s-1vcpu-1gb
  name: revops-helm
  source_dir: Helm
